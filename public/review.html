<html lang="en">
  <head>

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <title>Leave a Review | Gold Homes DMV</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --navy: #142033;
        --gold: #b8925a;
        --gold-strong: #96723f;
        --cream: #faf7f2;
        --white: #ffffff;
        --text: #3d3a35;
        --text-soft: #6b6660;
        --border: #e6e0d6;
        --heading: 'Playfair Display', Georgia, 'Times New Roman', serif;
        --sans: 'Inter', system-ui, 'Segoe UI', sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--cream);
        color: var(--text);
        font-family: var(--sans);
        line-height: 1.55;
      }
      .wrap {
        min-height: 100svh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 48px 24px;
        text-align: center;
      }
      .photo {
        width: 96px;
        height: 96px;
        border-radius: 50%;
        object-fit: cover;
        margin-bottom: 20px;
        border: 3px solid var(--white);
        box-shadow: 0 10px 24px -10px rgba(20, 32, 51, 0.35);
      }
      .eyebrow {
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--gold-strong);
        margin-bottom: 10px;
      }
      h1 {
        font-family: var(--heading);
        font-size: 34px;
        font-weight: 600;
        color: var(--navy);
        margin: 0 0 14px;
        max-width: 20ch;
      }
      p.lede {
        color: var(--text-soft);
        font-size: 16px;
        max-width: 42ch;
        margin: 0 0 36px;
      }
      .buttons {
        display: flex;
        flex-direction: column;
        gap: 14px;
        width: 100%;
        max-width: 380px;
      }
      .btn {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        padding: 16px 24px;
        border-radius: 999px;
        font-size: 16px;
        font-weight: 600;
        text-decoration: none;
        border: 1.5px solid transparent;
        transition: transform 0.15s ease, box-shadow 0.15s ease;
      }
      .btn:active {
        transform: translateY(1px);
      }
      .btn-google {
        background: var(--navy);
        color: #fff;
      }
      .btn-google:hover {
        box-shadow: 0 10px 24px -10px rgba(20, 32, 51, 0.5);
      }
      .btn-facebook {
        background: var(--white);
        border-color: var(--border);
        color: var(--navy);
      }
      .btn-facebook:hover {
        box-shadow: 0 10px 24px -10px rgba(20, 32, 51, 0.2);
      }
      .icon {
        width: 20px;
        height: 20px;
        flex: none;
      }
      .footer-note {
        margin-top: 40px;
        font-size: 13px;
        color: var(--text-soft);
      }
      .footer-note a {
        color: var(--gold-strong);
        text-decoration: none;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <img class="photo" src="/agent-headshot.jpg" alt="Worku Admasu" />
      <span class="eyebrow">Gold Homes DMV</span>
      <h1>How was your experience with Worku?</h1>
      <p class="lede">
        Thank you for working with me! A quick review helps other buyers and sellers in
        Maryland find someone they can trust — it only takes a minute.
      </p>

      <div class="buttons">
        <!-- TODO: replace with your exact Google review short link from
             business.google.com ("Ask for reviews" / "Get more reviews").
             This search fallback usually surfaces a "Write a review" button
             on the Google knowledge panel, but the direct link is faster. -->
        <a
          class="btn btn-google"
          href="https://www.google.com/search?q=Worku+Real+Estate+Agent+Burtonsville+MD+reviews"
          target="_blank"
          rel="noreferrer"
        >
          <svg class="icon" viewBox="0 0 24 24" fill="none">
            <path
              fill="#fff"
              d="M21.6 12.23c0-.7-.06-1.38-.18-2.03H12v3.84h5.4a4.62 4.62 0 0 1-2 3.03v2.5h3.24c1.9-1.75 2.96-4.32 2.96-7.34Z"
            />
            <path
              fill="#fff"
              d="M12 22c2.7 0 4.97-.9 6.63-2.43l-3.24-2.5c-.9.6-2.05.96-3.4.96-2.6 0-4.8-1.76-5.6-4.12H3.06v2.58A10 10 0 0 0 12 22Z"
            />
            <path fill="#fff" d="M6.4 13.9a6 6 0 0 1 0-3.8V7.52H3.06a10 10 0 0 0 0 8.96l3.34-2.58Z" />
            <path
              fill="#fff"
              d="M12 5.98c1.47 0 2.79.5 3.82 1.5l2.87-2.87A9.6 9.6 0 0 0 12 2a10 10 0 0 0-8.94 5.52l3.34 2.58c.8-2.36 3-4.12 5.6-4.12Z"
            />
          </svg>
          Leave a Google Review
        </a>

        <a
          class="btn btn-facebook"
          href="https://www.facebook.com/profile.php?id=61571965382964&sk=reviews"
          target="_blank"
          rel="noreferrer"
        >
          <svg class="icon" viewBox="0 0 24 24">
            <path
              fill="#1877F2"
              d="M13.5 21v-7.6h2.6l.4-3H13.5V8.4c0-.9.3-1.5 1.6-1.5h1.7V4.2C16.5 4.1 15.4 4 14.2 4c-2.5 0-4.2 1.5-4.2 4.3v2.1H7.4v3h2.6V21z"
            />
          </svg>
          Leave a Facebook Review
        </a>
      </div>

      <p class="footer-note">
        Prefer to just chat? Text or call <a href="tel:12023906053">202-390-6053</a>.
      </p>
    </div>
  </body>
</html>
